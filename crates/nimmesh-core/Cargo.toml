[package]
name = "nimmesh-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared, headless Rust core for nimiq.nimmesh: Nimiq signing, nimmesh packet codec, TTL/hop relay, and store-and-forward — exposed to Swift/Kotlin via UniFFI."

[lib]
name = "nimmesh_core"
# cdylib  -> Android .so / iOS dynamic lib
# staticlib -> iOS .a for the .xcframework
# lib     -> the uniffi-bindgen binary + Rust unit tests link against this
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

# G8: the live-broadcast tool. Built only with `--features gateway-rpc`, so a plain
# `cargo test` (default features) never compiles or runs it — `cargo test` stays offline.
[[example]]
name = "live_testnet_broadcast"
required-features = ["gateway-rpc"]

# Mesh swap: the live TESTNET HTLC fund -> claim-with-preimage proof (validates the redeem proof
# the @nimiq/core JS lib cannot). Built only with `--features gateway-rpc`; never in `cargo test`.
[[example]]
name = "live_testnet_htlc_swap"
required-features = ["gateway-rpc"]

# Mesh swap B3: the live signet BTC HTLC proof (fund P2WSH -> claim-with-preimage). Needs a one-time
# signet faucet tap (captcha) to fund the printed address; then it completes automatically.
[[example]]
name = "live_signet_btc_htlc"
required-features = ["bitcoin-gateway"]

# Mesh swap B4: the full atomic NIM<->BTC swap live on two chains (one secret unlocks both legs).
[[example]]
name = "live_cross_chain_swap"
required-features = ["gateway-rpc", "bitcoin-gateway"]

# The G6 (#77) live Amoy round-trip against the DEPLOYED NimmeshHtlc (docs/swap/AMOY.md).
[[example]]
name = "live_amoy_usdc_htlc"
required-features = ["polygon-gateway"]

# The G7 (#78) live gasless-funding proof against the forwarder-bound HTLC (docs/swap/AMOY.md).
[[example]]
name = "live_amoy_gasless_swap"
required-features = ["polygon-gateway"]

# The #72-tail live proof: the gateway-backed FundingVerifier vs the real Amoy HTLC.
[[example]]
name = "live_amoy_verifier"
required-features = ["polygon-gateway"]

# A2c: the LIVE two-node NIM⇄USDC mesh swap — two participant MeshNodes over the deterministic
# harness, REAL money on BOTH testnets (Albatross testnet + Polygon Amoy) through the REAL
# protocol (discovery → Propose/Accept → verifier-gated funding → withdraw(S) → NIM claim).
# Needs both HTTP stacks; never compiled by `cargo test` (default features).
[[example]]
name = "live_mesh_swap_nim_usdc"
required-features = ["polygon-gateway", "gateway-rpc"]

# G10c: the LIVE proof through the APP-FACING FFI constructors — a headless initiator +
# responder built by the exact `MeshNode::new_live_swap_initiator` / `new_live_swap_responder`
# the phone + Mac rig call, driving a REAL NIM⇄USDC swap on both testnets. Same HTTP stacks as
# A2c; never compiled by `cargo test`.
[[example]]
name = "live_ffi_mesh_swap"
required-features = ["polygon-gateway", "gateway-rpc"]

# G8 M5: the read-only proof that the verifier head cross-read AGREES on honest infra — two
# independent public Amoy endpoints + the NIM testnet head. No key, no funds, no tx.
[[example]]
name = "live_rpc_cross_read"
required-features = ["polygon-gateway", "gateway-rpc"]

# Swap demo: a std-only HTTP server that runs the REAL engine (swap_sim) against an in-memory sim
# chain and serves webui/, so the browser UI is powered by the actual SwapEngine. Sim-only, no funds.
[[example]]
name = "swap_demo_server"
required-features = ["bitcoin-leg"]

[features]
# G8: the real blocking HTTP JSON-RPC gateway client (`ureq` + `serde_json`). OFF by default so
# the pure-protocol core stays dependency-light and WASM-friendly; the `gateway::RpcGateway` +
# `rpc::MockRpc` (offline tests) need no feature. TESTNET-only either way (every constructor is
# guarded).
gateway-rpc = ["dep:ureq", "dep:serde_json"]

# Mesh swap (B1): the Bitcoin counterparty leg — `rust-bitcoin` builds the HTLC P2WSH script +
# the claim/refund segwit txs (BIP143 sighash, secp256k1). OFF by default so the pure-protocol
# core stays lean; ON for the BTC leg (on-device + the signet tools). TESTNET/signet-guarded.
bitcoin-leg = ["dep:bitcoin"]

# B2: the BTC gateway — broadcast + confirmation queries against a public signet indexer
# (mempool.space/signet/api). Reuses the blocking `ureq` HTTP client + `serde_json` (same deps as
# `gateway-rpc`). The on-device tx-building (`bitcoin-leg`) needs no HTTP; only a gateway node does.
bitcoin-gateway = ["bitcoin-leg", "dep:ureq", "dep:serde_json"]

# P1 (mesh swap): the USDC-on-Polygon counterparty leg — EVM HTLC contract calls + tx signing. `sha3`
# gives Keccak-256 (EVM addresses + ABI selectors). OFF by default so the pure-protocol core stays
# lean/WASM-friendly; ON for the Polygon leg. TESTNET/Amoy-guarded (mainnet + real funds gated).
polygon-leg = ["dep:sha3", "dep:k256"]

# P8: the Polygon (EVM) JSON-RPC gateway — broadcast + confirmation/read queries against a public
# Amoy TESTNET RPC. Reuses the blocking `ureq` HTTP client + `serde_json` (same deps as `gateway-rpc`/
# `bitcoin-gateway`). Depends on `polygon-leg` (uses the EVM tx types). OFF by default; the request/
# response CODEC is unit-tested OFFLINE (no network in `cargo test`). Amoy-only; broadcast + real funds
# + mainnet are owner-gated (a manual/example call, never the gate).
polygon-gateway = ["polygon-leg", "dep:ureq", "dep:serde_json"]

# Pure proc-macro mode (uniffi::setup_scaffolding!) — no UDL file, no build.rs.
[dependencies]
uniffi = { workspace = true, features = ["cli"] }

# G8: gateway broadcast (TESTNET, money-path). `ureq` is a lightweight BLOCKING HTTP client
# (no tokio) for the Albatross JSON-RPC POST; `serde_json` builds/parses the JSON-RPC 2.0
# envelope. Both are OPTIONAL and pulled in ONLY by the `gateway-rpc` feature — the protocol
# core never links them. The pure-protocol path + the offline `MockRpc` tests compile without them.
ureq = { version = "2", optional = true, features = ["json"] }
serde_json = { version = "1", optional = true }

# G11 (#82): the OS CSPRNG behind `swap_secret::draw_swap_seed` — the swap money path draws its own
# entropy rather than trusting the app to. NOT optional (it was, back when only the gateway examples
# seeded a keypair): the entropy gate is on the core money path, and `x25519-dalek` below already
# links `getrandom` unconditionally, so making it direct adds no dependency or portability surface.
getrandom = "0.2"

# B1: the Bitcoin leg (mesh swap). `bitcoin` (rust-bitcoin) owns the HTLC redeem script, the P2WSH
# address, BIP143 segwit sighash, and secp256k1 signing — it bundles `secp256k1`. OPTIONAL, pulled
# in only by the `bitcoin-leg` feature so the core stays dependency-light + WASM-friendly when off.
bitcoin = { version = "0.32", optional = true }

# P1: Keccak-256 for the USDC-on-Polygon (EVM) leg — EVM addresses + ABI function selectors. Note the
# EVM uses Keccak-256 (`Keccak256`), NOT NIST SHA3-256. Pulled in only by `polygon-leg`. Pure Rust.
sha3 = { version = "0.10", optional = true }

# P4c: the EVM secp256k1 signer (mesh swap). `k256` (RustCrypto, PURE RUST → WASM-friendly, unlike
# the C `secp256k1` the BTC leg uses) provides RFC-6979 deterministic ECDSA with recoverable
# signatures + low-s normalization (EIP-2). OPTIONAL, pulled in ONLY by `polygon-leg` so the core
# stays lean. TESTNET only; signing a mainnet tx / a real funded key is owner-gated.
k256 = { version = "0.13", optional = true, features = ["ecdsa"] }

# G11: optional encrypted memo / 1:1 chat. `snow` is the Noise Protocol implementation
# driving the `Noise_XX_25519_ChaChaPoly_SHA256` mutual-auth, identity-hiding handshake;
# `x25519-dalek` derives the long-term Curve25519 *transport* static public key from a
# secret (deterministic identities for tests); `sha2` computes the static-key fingerprint
# for out-of-band verification. TRANSPORT-PRIVACY ONLY — never wallet/seed/tx-signing.
snow = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
sha2 = "0.10"

# G3: offline Nimiq Albatross transaction signing (TESTNET, money-path / gated).
# `ed25519-dalek` is the RFC-8032 Ed25519 signer over the 67-byte `serializeContent()`
# (single-signer Nimiq signing is plain Ed25519, no WASM, no consensus client);
# `blake2` computes both the 32-byte tx hash (Blake2b-256 of the content) and the address
# derivation (Blake2b-256(pubkey)[..20]). The base32 IBAN address codec and hex helpers are
# implemented in-crate (no crate dep). The seed NEVER crosses the FFI boundary — only a
# public key + signature leave the enclave seam (`EnclaveKey`). See `src/nimiq`.
ed25519-dalek = "2"
blake2 = "0.10"

# proptest drives the G4 wire-codec property/fuzz tests: decode() never panics on
# arbitrary bytes, and any valid packet/envelope round-trips byte-for-byte. serde_json
# loads the @nimiq/core G3 reference fixtures (tests/fixtures) the signer is asserted
# byte-exact against.
[dev-dependencies]
proptest = "1.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The header-codec fidelity anchor (nimiq/header.rs): `postcard-bytes` is the published
# fork of postcard that `nimiq-serde` wraps ON CHAIN — the differential test serializes a
# mirror struct with it and asserts byte-equality with our hand-rolled encoder. Dev-only;
# the shipped core never links it.
postcard = { package = "postcard-bytes", version = "0.1", features = ["use-std"] }
