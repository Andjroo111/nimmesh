[package]
name = "nimmesh-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared, headless Rust core for nimiq.nimmesh: Nimiq signing, nimmesh packet codec, TTL/hop relay, and store-and-forward — exposed to Swift/Kotlin via UniFFI."

[lib]
name = "nimmesh_core"
# cdylib  -> Android .so / iOS dynamic lib
# staticlib -> iOS .a for the .xcframework
# lib     -> the uniffi-bindgen binary + Rust unit tests link against this
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

# G8: the live-broadcast tool. Built only with `--features gateway-rpc`, so a plain
# `cargo test` (default features) never compiles or runs it — `cargo test` stays offline.
[[example]]
name = "live_testnet_broadcast"
required-features = ["gateway-rpc"]

# Mesh swap: the live TESTNET HTLC fund -> claim-with-preimage proof (validates the redeem proof
# the @nimiq/core JS lib cannot). Built only with `--features gateway-rpc`; never in `cargo test`.
[[example]]
name = "live_testnet_htlc_swap"
required-features = ["gateway-rpc"]

[features]
# G8: the real blocking HTTP JSON-RPC gateway client (`ureq` + `serde_json`) + the
# keypair-entropy source for the live example. OFF by default so the pure-protocol core
# stays dependency-light and WASM-friendly; the `gateway::RpcGateway` + `rpc::MockRpc`
# (offline tests) need no feature. TESTNET-only either way (every constructor is guarded).
gateway-rpc = ["dep:ureq", "dep:serde_json", "dep:getrandom"]

# Mesh swap (B1): the Bitcoin counterparty leg — `rust-bitcoin` builds the HTLC P2WSH script +
# the claim/refund segwit txs (BIP143 sighash, secp256k1). OFF by default so the pure-protocol
# core stays lean; ON for the BTC leg (on-device + the signet tools). TESTNET/signet-guarded.
bitcoin-leg = ["dep:bitcoin"]

# B2: the BTC gateway — broadcast + confirmation queries against a public signet indexer
# (mempool.space/signet/api). Reuses the blocking `ureq` HTTP client + `serde_json` (same deps as
# `gateway-rpc`). The on-device tx-building (`bitcoin-leg`) needs no HTTP; only a gateway node does.
bitcoin-gateway = ["bitcoin-leg", "dep:ureq", "dep:serde_json"]

# Pure proc-macro mode (uniffi::setup_scaffolding!) — no UDL file, no build.rs.
[dependencies]
uniffi = { workspace = true, features = ["cli"] }

# G8: gateway broadcast (TESTNET, money-path). `ureq` is a lightweight BLOCKING HTTP client
# (no tokio) for the Albatross JSON-RPC POST; `serde_json` builds/parses the JSON-RPC 2.0
# envelope; `getrandom` seeds the live example's ephemeral testnet keypair. All three are
# OPTIONAL and pulled in ONLY by the `gateway-rpc` feature — the protocol core never links
# them. The pure-protocol path + the offline `MockRpc` tests compile without them.
ureq = { version = "2", optional = true, features = ["json"] }
serde_json = { version = "1", optional = true }
getrandom = { version = "0.2", optional = true }

# B1: the Bitcoin leg (mesh swap). `bitcoin` (rust-bitcoin) owns the HTLC redeem script, the P2WSH
# address, BIP143 segwit sighash, and secp256k1 signing — it bundles `secp256k1`. OPTIONAL, pulled
# in only by the `bitcoin-leg` feature so the core stays dependency-light + WASM-friendly when off.
bitcoin = { version = "0.32", optional = true }

# G11: optional encrypted memo / 1:1 chat. `snow` is the Noise Protocol implementation
# driving the `Noise_XX_25519_ChaChaPoly_SHA256` mutual-auth, identity-hiding handshake;
# `x25519-dalek` derives the long-term Curve25519 *transport* static public key from a
# secret (deterministic identities for tests); `sha2` computes the static-key fingerprint
# for out-of-band verification. TRANSPORT-PRIVACY ONLY — never wallet/seed/tx-signing.
snow = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
sha2 = "0.10"

# G3: offline Nimiq Albatross transaction signing (TESTNET, money-path / gated).
# `ed25519-dalek` is the RFC-8032 Ed25519 signer over the 67-byte `serializeContent()`
# (single-signer Nimiq signing is plain Ed25519, no WASM, no consensus client);
# `blake2` computes both the 32-byte tx hash (Blake2b-256 of the content) and the address
# derivation (Blake2b-256(pubkey)[..20]). The base32 IBAN address codec and hex helpers are
# implemented in-crate (no crate dep). The seed NEVER crosses the FFI boundary — only a
# public key + signature leave the enclave seam (`EnclaveKey`). See `src/nimiq`.
ed25519-dalek = "2"
blake2 = "0.10"

# proptest drives the G4 wire-codec property/fuzz tests: decode() never panics on
# arbitrary bytes, and any valid packet/envelope round-trips byte-for-byte. serde_json
# loads the @nimiq/core G3 reference fixtures (tests/fixtures) the signer is asserted
# byte-exact against.
[dev-dependencies]
proptest = "1.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
