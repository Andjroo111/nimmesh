[package]
name = "bitmesh-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared, headless Rust core for nimiq.bitmesh: Nimiq signing, bitmesh packet codec, TTL/hop relay, and store-and-forward — exposed to Swift/Kotlin via UniFFI."

[lib]
name = "bitmesh_core"
# cdylib  -> Android .so / iOS dynamic lib
# staticlib -> iOS .a for the .xcframework
# lib     -> the uniffi-bindgen binary + Rust unit tests link against this
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

# Pure proc-macro mode (uniffi::setup_scaffolding!) — no UDL file, no build.rs.
[dependencies]
uniffi = { workspace = true, features = ["cli"] }

# proptest drives the G4 wire-codec property/fuzz tests: decode() never panics on
# arbitrary bytes, and any valid packet/envelope round-trips byte-for-byte.
[dev-dependencies]
proptest = "1.8.0"
