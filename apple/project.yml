name: NimmeshApp
options:
  bundleIdPrefix: com.nimmesh
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  NimmeshCore:
    # Generated from the Rust core via: cd crates/nimmesh-core && cargo swift package -n NimmeshCore -p ios -y
    path: ../crates/nimmesh-core/NimmeshCore
targets:
  NimmeshApp:
    type: application
    platform: iOS
    sources:
      - NimmeshApp/Sources
      # Bitchat interop phase 2 (#233): the byte-exact Bitchat wire kit, SHARED with
      # the mac-node (single source of truth for the protocol).
      - path: ../shared/BitchatKit.swift
      # App icon (gold Nimiq hexagon on the navy radial gradient) — required for TestFlight.
      - NimmeshApp/Assets.xcassets
      # C1e: the official BIP39 English wordlist (2048 words), bundled flat so
      # Bundle.main.path(forResource:"bip39-english", ofType:"txt") resolves it.
      - path: NimmeshApp/Resources/bip39-english.txt
        buildPhase: resources
      # The UI is the real nimiq-ui WEB layer (webui/), hosted in a WKWebView (A1).
      # A folder reference preserves webui/'s subdir structure (nimiq/legacy, the
      # component dirs) so index.html's relative hrefs resolve from the app bundle.
      - path: ../webui
        type: folder
        buildPhase: resources
    dependencies:
      - package: NimmeshCore
    info:
      path: NimmeshApp/Info.plist
      properties:
        CFBundleDisplayName: NIMmesh
        # Drive version + build number from the build settings (xcodegen otherwise defaults them
        # to 1.0 / 1). build-testflight.sh overrides MARKETING_VERSION (cargo version) and
        # CURRENT_PROJECT_VERSION (a unique timestamp) so each TestFlight upload is unique.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance: the app uses only EXEMPT cryptography (Ed25519 signatures for
        # authentication + standard TLS), so it declares no non-exempt encryption. This skips
        # the per-build TestFlight encryption question. (Confirm this classification suits you.)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The QR scanner (Send -> scan an address / payment request)
        NSCameraUsageDescription: "nimmesh uses the camera to scan a recipient's address or payment QR code."
        # "Unlock your Backup" (Face ID with passcode fallback) before showing recovery material
        NSFaceIDUsageDescription: "nimmesh uses Face ID to unlock your backup before showing recovery words or backup codes."
        # Mesh needs to advertise + scan, incl. in the background (ADR-0002)
        NSBluetoothAlwaysUsageDescription: "nimmesh relays payments through nearby phones over Bluetooth so you can pay with no internet."
        NSBluetoothPeripheralUsageDescription: "nimmesh relays payments through nearby phones over Bluetooth so you can pay with no internet."
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        # C1c: allow the TESTNET JSON-RPC + faucet endpoints (ATS would otherwise silently
        # block them even over HTTPS if they lack forward secrecy). Testnet domains only.
        NSAppTransportSecurity:
          NSExceptionDomains:
            nimiqwatch.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionRequiresForwardSecrecy: false
            nimiq-testnet.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionRequiresForwardSecrecy: false
    settings:
      base:
        PRODUCT_NAME: NimmeshApp
        PRODUCT_BUNDLE_IDENTIFIER: com.nimmesh.app
        # UniFFI ships a hand-written C module map; Xcode 26 explicit modules
        # can't precompile it — use the classic implicit module build.
        SWIFT_ENABLE_EXPLICIT_MODULES: "NO"
        ALWAYS_SEARCH_USER_PATHS: "NO"
        MARKETING_VERSION: "0.10.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        # Device builds sign automatically with the owner's free "Personal Team" (the Team ID
        # is an identifier, not a secret). Simulator builds need no signing (keeps headless
        # CI/build clean), so scope the "off" to the simulator SDK only. This means a real
        # device build just works after `xcodegen generate` — no manual signing setup.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "78572SM3V4"
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: "NO"
