# Pinned, not "latest". A build that resolves differently tomorrow is not a build.
[versions]
agp = "9.3.1"
# AGP 9 has built-in Kotlin support, so there is no separate Kotlin Gradle plugin to
# version here. This is the Kotlin language level AGP compiles against.
kotlin = "2.4.10"
# UniFFI's Kotlin bindings call into the .so through JNA. The @aar variant is the one
# that carries Android's native JNA libraries; the plain jar does not and fails at runtime.
jna = "5.19.1"
webkit = "1.17.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
androidxRunner = "1.7.0"

[libraries]
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-runner = { module = "androidx.test:runner", version.ref = "androidxRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
