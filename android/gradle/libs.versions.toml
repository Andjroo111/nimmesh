# Pinned, not "latest". A build that resolves differently tomorrow is not a build.
[versions]
agp = "9.3.1"
# AGP 9 has built-in Kotlin support, so there is no separate Kotlin Gradle plugin to
# version here. This is the Kotlin language level AGP compiles against.
kotlin = "2.4.10"
# UniFFI's Kotlin bindings call into the .so through JNA. The @aar variant is the one
# that carries Android's native JNA libraries; the plain jar does not and fails at runtime.
jna = "5.19.1"
# Ed25519 and PBKDF2-HMAC-SHA512, used through BouncyCastle's LOW-LEVEL API only, never
# registered as a JCE provider (registering one collides with the cut-down BouncyCastle
# Android already ships). See wallet/Ed25519.kt for why the platform APIs do not serve.
bouncycastle = "1.85.2"
webkit = "1.17.0"
# CameraX for the preview and frame stream, ZXing for the decode. Deliberately NOT ML Kit:
# its barcode scanner needs Google Play Services, and this app is distributed as a direct
# APK precisely so it does not depend on anyone's store being present.
camerax = "1.6.1"
zxing = "3.5.4"
json = "20251224"
junit = "4.13.2"
androidxJunit = "1.3.0"
androidxRunner = "1.7.0"

[libraries]
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
json = { module = "org.json:json", version.ref = "json" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-runner = { module = "androidx.test:runner", version.ref = "androidxRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
