org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# The Rust core ships as prebuilt .so files under core/src/main/jniLibs (built by
# android/scripts/build-core.sh). Gradle must not try to strip or rebuild them.
android.nonTransitiveRClass=true
